[project]
name = "pitchgpt"
version = "0.1.0"
description = "Sequential causal model for baseball at-bats."
requires-python = ">=3.10,<3.13"
dependencies = [
    "pybaseball>=2.2",
    "pandas>=2.2",
    "pyarrow>=15",
    "numpy>=1.26,<2.1",
    "tqdm>=4.66",
    "requests>=2.31",
    "torch>=2.4",
    "xgboost>=2.0",
    "scikit-learn>=1.3",
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.46.0",
    "scipy>=1.15.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
package = false
